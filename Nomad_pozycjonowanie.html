<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nomad pozycjonowanie</title>
<style>
  body { 
    background: #000; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    height: 100vh; 
    margin: 0; 
    font-family: Arial, sans-serif; 
    color: #fff;
  }
  
  #app-container { 
    width: 340px; 
    height: 740px; 
    border: 6px solid #222; 
    border-radius: 24px; 
    position: relative; 
    background: #121212; 
    display: flex; 
    flex-direction: column; 
    box-sizing: border-box; 
    overflow: hidden;
  }
  
  .header { text-align: center; padding: 15px 10px; background: #1a1a1a; }
  .title { font-size: 16px; font-weight: bold; letter-spacing: 1px; color: #00d2ff; margin-bottom: 12px; text-transform: uppercase; }
  .tabs { display: flex; justify-content: space-around; font-size: 12px; color: #777; }
  .tab { padding-bottom: 5px; }
  .tab.active { color: #00d2ff; font-weight: bold; border-bottom: 2px solid #00d2ff; }
  
  .panel { 
    flex: 1; border-bottom: 2px solid #222; position: relative; display: flex; 
    flex-direction: column; align-items: center; justify-content: flex-end; 
    padding-bottom: 50px; background: linear-gradient(to bottom, #1e1e1e 65%, #303030 65%); 
  }
  
  .van-img { 
    max-width: 140px; max-height: 130px; object-fit: contain; 
    transition: transform 0.1s linear; z-index: 2; margin-bottom: -5px; 
  }
  
  .van-side-img { 
    max-width: 220px; max-height: 110px; object-fit: contain; 
    transition: transform 0.1s linear; z-index: 2; margin-bottom: -5px;
  }
  
  .ground-line { position: absolute; bottom: 45px; width: 100%; height: 4px; background: #555; z-index: 1; }
  
  .info-box { 
    position: absolute; width: 100%; top: 15px; display: flex; 
    justify-content: space-between; padding: 0 15px; box-sizing: border-box; 
    font-size: 11px; font-weight: bold; color: #aaa;
  }
  .info-box span { color: #fff; }
  
  .center-angle { 
    position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); 
    font-size: 22px; font-weight: bold; color: #00d2ff; 
  }
  
  .controls { padding: 15px 20px 20px 20px; background: #1a1a1a; display: flex; flex-direction: column; gap: 10px; }
  
  .btn-start { width: 100%; padding: 14px; background: #008800; color: #fff; font-size: 14px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; text-transform: uppercase; }
  .btn-zero { width: 100%; padding: 14px; background: #222; color: #00d2ff; font-size: 14px; font-weight: bold; border: 2px solid #00d2ff; border-radius: 8px; cursor: pointer; text-transform: uppercase; transition: background 0.2s, color 0.2s; }
  .btn-zero:active { background: #00d2ff; color: #000; }
  
  .footer { position: absolute; bottom: 5px; right: 15px; font-size: 10px; color: #555; }
</style>
</head>
<body>

<div id="app-container">
  <div class="header">
    <div class="title">Nomad pozycjonowanie</div>
    <div class="tabs">
      <div class="tab">PRZÓD</div>
      <div class="tab active">TYŁ</div>
      <div class="tab">GÓRA</div>
    </div>
  </div>

  <div class="panel">
    <div class="info-box">
      <div id="left-cm">LEWY: <span>0.0 cm</span></div>
      <div id="right-cm">PRAWY: <span>0.0 cm</span></div>
    </div>
    
    <img id="van-rear" class="van-img" src="tyl.png" alt="Tył">
    
    <div class="ground-line"></div>
    <div class="center-angle" id="roll-angle">0.0&deg;</div>
  </div>

  <div class="panel">
    <div class="info-box">
      <div id="front-cm">PRZÓD: <span>0.0 cm</span></div>
      <div id="rear-cm">TYŁ: <span>0.0 cm</span></div>
    </div>
    
    <img id="van-side" class="van-side-img" src="bok.png" alt="Bok">
    
    <div class="ground-line"></div>
    <div class="center-angle" id="pitch-angle">0.0&deg;</div>
  </div>

  <div class="controls">
    <button id="btn-start" class="btn-start">Uruchom Czujniki</button>
    <button id="btn-zero" class="btn-zero">Ustaw Zero</button>
  </div>

  <div class="footer">Created by WawP</div>
</div>

<script>
  const btnStart = document.getElementById('btn-start');
  const btnZero = document.getElementById('btn-zero');

  const vanRear = document.getElementById('van-rear');
  const vanSide = document.getElementById('van-side');
  
  const rollAngleText = document.getElementById('roll-angle');
  const pitchAngleText = document.getElementById('pitch-angle');
  
  const leftCm = document.getElementById('left-cm');
  const rightCm = document.getElementById('right-cm');
  const frontCm = document.getElementById('front-cm');
  const rearCm = document.getElementById('rear-cm');

  const trackWidth = 162; 
  const wheelBase = 310;  

  let currentRawRoll = 0;
  let currentRawPitch = 0;
  let rollOffset = 0;
  let pitchOffset = 0;

  function updateUI() {
    let roll = currentRawRoll - rollOffset;
    let pitch = currentRawPitch - pitchOffset;

    rollAngleText.innerText = roll.toFixed(1) + '°';
    pitchAngleText.innerText = pitch.toFixed(1) + '°';

    vanRear.style.transform = `rotate(${roll}deg)`;
    vanSide.style.transform = `rotate(${pitch}deg)`;

    let lCm = 0.0, rCm = 0.0, fCm = 0.0, bCm = 0.0;

    if (roll < 0) {
        lCm = Math.abs(Math.sin(roll * Math.PI / 180) * trackWidth);
    } else if (roll > 0) {
        rCm = Math.abs(Math.sin(roll * Math.PI / 180) * trackWidth);
    }

    if (pitch > 0) {
        fCm = Math.abs(Math.sin(pitch * Math.PI / 180) * wheelBase);
    } else if (pitch < 0) {
        bCm = Math.abs(Math.sin(pitch * Math.PI / 180) * wheelBase);
    }

    if (roll < 0) {
        leftCm.innerHTML = `PODNIEŚ LEWY: <span style="color:#ff4444">+${lCm.toFixed(1)} cm</span>`;
        rightCm.innerHTML = `PRAWY: <span>0.0 cm</span>`;
    } else if (roll > 0) {
        leftCm.innerHTML = `LEWY: <span>0.0 cm</span>`;
        rightCm.innerHTML = `PODNIEŚ PRAWY: <span style="color:#ff4444">+${rCm.toFixed(1)} cm</span>`;
    } else {
        leftCm.innerHTML = `LEWY: <span>0.0 cm</span>`;
        rightCm.innerHTML = `PRAWY: <span>0.0 cm</span>`;
    }

    if (pitch > 0) {
        frontCm.innerHTML = `PRZÓD: <span>0.0 cm</span>`;
        rearCm.innerHTML = `PODNIEŚ TYŁ: <span style="color:#ff4444">+${fCm.toFixed(1)} cm</span>`;
    } else if (pitch < 0) {
        frontCm.innerHTML = `PODNIEŚ PRZÓD: <span style="color:#ff4444">+${bCm.toFixed(1)} cm</span>`;
        rearCm.innerHTML = `TYŁ: <span>0.0 cm</span>`;
    } else {
        frontCm.innerHTML = `PRZÓD: <span>0.0 cm</span>`;
        rearCm.innerHTML = `TYŁ: <span>0.0 cm</span>`;
    }
  }

  function handleOrientation(event) {
    currentRawPitch = event.beta || 0;
    currentRawRoll = event.gamma || 0;
    updateUI();
  }

  btnStart.addEventListener('click', () => {
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission()
        .then(permissionState => {
          if (permissionState === 'granted') {
            window.addEventListener('deviceorientation', handleOrientation);
            btnStart.style.display = 'none';
          }
        })
        .catch(console.error);
    } else {
      window.addEventListener('deviceorientation', handleOrientation);
      btnStart.style.display = 'none';
    }
  });

  btnZero.addEventListener('click', () => {
    rollOffset = currentRawRoll;
    pitchOffset = currentRawPitch;
    updateUI();
  });

  updateUI();
</script>

</body>
</html>
